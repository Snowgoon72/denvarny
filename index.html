<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samlerregister - Skyversjon (Supabase)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="loadingOverlay" class="fixed inset-0 bg-slate-950 z-[200] flex flex-col items-center justify-center p-4">
    <div class="text-center">
      <span class="text-6xl animate-bounce block mb-4">☁️</span>
      <h2 class="text-2xl font-black text-amber-500">Kobler til skyen...</h2>
      <p class="text-slate-400 mt-2">Henter samlinger fra Supabase</p>
    </div>
  </div>

  <div id="loginModal" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur z-[100] flex flex-col items-center justify-center p-4">
    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 max-w-sm w-full shadow-2xl relative overflow-hidden">
      <div class="text-center mb-6">
        <span class="text-4xl">📚</span>
        <h2 class="text-2xl font-black text-amber-500 mt-2">Samlerbasen</h2>
        <p id="modalUndertekst" class="text-slate-400 text-sm mt-1">Logg inn for å se din og venners samling</p>
      </div>

      <form id="skjemaLoggInn" onsubmit="loggInn(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Brukernavn</label>
          <input type="text" id="loginBrukernavn" required placeholder="F.eks. Jørn" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Passord</label>
          <input type="password" id="loginPassord" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-lg mt-2 transition">Logg inn</button>
        
        <div class="text-center mt-4 space-y-2">
          <p class="text-xs"><button type="button" onclick="byttTilGlemtPassord()" class="text-slate-400 hover:text-white underline transition">Glemt passord?</button></p>
          <p class="text-sm text-slate-400 border-t border-slate-800 pt-3">Ny her? <button type="button" onclick="byttTilRegistrering()" class="text-amber-500 font-bold hover:underline">Opprett konto</button></p>
        </div>
      </form>

      <form id="skjemaRegistrer" onsubmit="registrerBruker(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Brukernavn</label>
          <input type="text" id="regBrukernavn" required placeholder="F.eks. Jørn99" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">E-postadresse</label>
          <input type="email" id="regEpost" required placeholder="din@epost.no" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Velg passord</label>
          <input type="password" id="regPassord" required placeholder="Min. 6 tegn" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Land</label>
            <input type="text" id="regLand" placeholder="Norge" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Språk</label>
            <select id="regSpraak" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none">
              <option value="Norsk">Norsk</option>
              <option value="Svensk">Svensk</option>
              <option value="Dansk">Dansk</option>
              <option value="Engelsk">Engelsk</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Synlighet</label>
          <select id="regSynlighet" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none">
            <option value="offentlig">Offentlig profil</option>
            <option value="privat">Privat profil</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-lg mt-2 transition">Registrer meg</button>
        <p class="text-center text-sm text-slate-400 mt-4">Allerede konto? <button type="button" onclick="byttTilLoggInn()" class="text-amber-500 font-bold hover:underline">Logg inn</button></p>
      </form>

      <form id="skjemaGlemtPassord" onsubmit="sendGlemtPassord(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Skriv inn din E-post</label>
          <input type="email" id="glemtEpostFelt" required placeholder="din@epost.no" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-black py-3 rounded-lg mt-2 transition">Send passord</button>
        <p class="text-center text-sm text-slate-400 mt-4"><button type="button" onclick="byttTilLoggInn()" class="text-slate-300 hover:text-white underline">Tilbake til innlogging</button></p>
      </form>
    </div>
  </div>

  <div id="profilModal" class="hidden fixed inset-0 bg-black/80 z-[60] flex flex-col items-center justify-center p-4">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 max-w-md w-full shadow-2xl overflow-y-auto max-h-[90vh]">
      <h2 class="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2">⚙ Min Profil</h2>
      
      <form onsubmit="lagreProfil(event)" class="space-y-4 text-sm">
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 space-y-3">
          <h3 class="font-bold text-slate-300 text-xs uppercase tracking-wider">Kontodetaljer</h3>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Brukernavn</label>
            <input type="text" id="profilBrukernavn" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">E-postadresse</label>
            <input type="email" id="profilEpost" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Nytt passord (La stå tomt for å beholde)</label>
            <input type="password" id="profilPassord" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" />
          </div>
        </div>
        
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Litt om meg / min samling</label>
          <textarea id="profilInfo" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none"></textarea>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Mitt Land</label>
            <input type="text" id="profilLand" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Foretrukket språk</label>
            <select id="profilSpraak" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none">
              <option value="Norsk">Norsk</option>
              <option value="Svensk">Svensk</option>
              <option value="Dansk">Dansk</option>
              <option value="Engelsk">Engelsk</option>
            </select>
          </div>
        </div>
        
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Standard synlighet</label>
          <select id="profilSynlighet" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none">
            <option value="offentlig">Offentlig (Alle kan se mine gjenstander)</option>
            <option value="privat">Privat (Kun jeg kan se mine gjenstander)</option>
          </select>
        </div>
        
        <div class="flex gap-3 pt-2 pb-4">
          <button type="button" onclick="document.getElementById('profilModal').classList.add('hidden')" class="flex-1 bg-slate-800 text-slate-300 py-2.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">Avbryt</button>
          <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg transition">Lagre endringer</button>
        </div>
      </form>

      <div class="mt-4 pt-4 border-t border-rose-900/50 space-y-2">
        <h3 class="font-bold text-rose-500 text-xs uppercase tracking-wider mb-2 flex items-center gap-1">⚠️ Faresone</h3>
        <button type="button" onclick="slettMinSamling()" class="w-full bg-slate-900 hover:bg-rose-950 text-rose-400 border border-rose-900/50 text-xs font-bold py-2.5 rounded-lg transition">Slett hele min samling</button>
        <button type="button" onclick="slettMinProfil()" class="w-full bg-slate-900 hover:bg-rose-900 text-rose-500 border border-rose-800 text-xs font-bold py-2.5 rounded-lg transition">Slett min profil & samling</button>
      </div>

    </div>
  </div>

  <div id="endreModal" class="hidden fixed inset-0 bg-black/85 z-[65] flex flex-col items-center justify-center p-4">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 max-w-lg w-full shadow-2xl overflow-y-auto max-h-[90vh]">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">✏ Rediger objekt</h2>
        <button onclick="lukkEndreModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
      </div>
      <form id="skjemaEndre" onsubmit="lagreEndring(event)" class="space-y-3 text-xs">
        <input type="hidden" id="endreId" />
        
        <div>
          <label class="block font-semibold text-slate-400 mb-1">Tittel (Lokal)</label>
          <input type="text" id="endreTittel" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Engelsk Tittel</label>
            <input type="text" id="endreTittelEng" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Originaltittel</label>
            <input type="text" id="endreTittelOrig" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-400 mb-1">År</label>
            <input type="number" id="endreAar" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block font-semibold text-emerald-400 mb-1">Antatt verdi (NOK)</label>
            <input type="number" id="endreVerdi" placeholder="0" class="w-full bg-slate-950 border border-emerald-500/50 rounded-lg px-3 py-2 text-emerald-400 font-bold" />
          </div>
        </div>

        <div id="endreFilmSeksjon" class="space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold text-slate-400 mb-1">Sjanger</label>
              <input type="text" id="endreSjanger" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
            </div>
            <div>
              <label class="block font-semibold text-amber-400 mb-1">Rating (0-10)</label>
              <input type="number" step="0.1" id="endreRating" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-amber-400 font-bold" />
            </div>
          </div>
          <div>
            <label class="block font-semibold text-slate-400 mb-1">IMDb-lenke</label>
            <input type="url" id="endreImdb" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-blue-400" />
          </div>
        </div>

        <div id="endreTegneserieSeksjon" class="grid grid-cols-2 gap-2 hidden">
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Bladserie</label>
            <input type="text" id="endreBladserie" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Nummer</label>
            <input type="text" id="endreNummer" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Lagringsplass</label>
            <input type="text" id="endreLagret" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Tilstand</label>
            <select id="endreTilstand" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
              <option value="Ok">Ok / Vanlig brukt</option>
              <option value="Mint / Ny">Mint / Ny (Forseglet)</option>
              <option value="Samlerkvalitet">Samlerkvalitet</option>
              <option value="Slitt">Slitt / Skadet</option>
              <option value="Ikke relevant">Ikke relevant</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Status</label>
            <select id="endreStatus" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-amber-400 font-bold">
              <option value="Har">Ja (I samling)</option>
              <option value="Har ikke">Nei (Ønskeliste)</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-400 mb-1">Synlighet</label>
            <select id="endreSynlighet" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-300">
              <option value="standard">Følg profilstandard</option>
              <option value="offentlig">Offentlig</option>
              <option value="privat">Privat</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-400 mb-1">Kommentar / Notat</label>
          <input type="text" id="endreKommentar" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" onclick="lukkEndreModal()" class="flex-1 bg-slate-800 text-slate-300 py-2.5 rounded-lg border border-slate-700 hover:bg-slate-700">Avbryt</button>
          <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg">Oppdater objekt</button>
        </div>
      </form>
    </div>
  </div>

  <div id="hylleModal" class="hidden fixed inset-0 bg-slate-950/95 z-[70] flex flex-col items-center justify-start p-4 sm:p-8 overflow-y-auto">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 w-full max-w-3xl shadow-2xl mt-6">
      <h2 class="text-xl font-bold text-indigo-400 mb-2">📚 AI Hyllebilde-resultater</h2>
      <p class="text-sm text-slate-400 mb-4">Gjennomgå titlene, velg format, og lagre til samlingen din.</p>
      <div id="hylleListe" class="space-y-3 mb-6 max-h-[50vh] overflow-y-auto pr-2"></div>
      <div class="flex gap-3">
        <button type="button" onclick="lukkHylleModal()" class="flex-1 bg-slate-800 text-slate-300 py-3 rounded-lg border border-slate-700 hover:bg-slate-700 transition font-bold">Avbryt</button>
        <button type="button" onclick="lagreHylleTilDatabase()" class="flex-1 bg-indigo-500 hover:bg-indigo-400 text-slate-950 font-black py-3 rounded-lg transition">Lagre alle til min samling</button>
      </div>
    </div>
  </div>

  <header class="border-b border-slate-800 bg-slate-950/90 backdrop-
