<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samlerregister - Skyversjon (Supabase)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- SUPABASE BIBLIOTEK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- CROPPER.JS FOR Å KUTTE BILDER -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- LASTE-SKJERM MENS VI KOBLER TIL SKYEN -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-950 z-[200] flex flex-col items-center justify-center p-4">
    <div id="loadingInnhold" class="text-center bg-slate-900 p-8 rounded-2xl border border-slate-700 shadow-2xl max-w-lg w-full">
      <span class="text-6xl animate-bounce block mb-4">☁️</span>
      <h2 class="text-2xl font-black text-amber-500">Kobler til skyen...</h2>
      <p class="text-slate-400 mt-2">Henter samlinger fra Supabase</p>
    </div>
  </div>

  <!-- KRASJ-DETEKTOR (Fanger opp feil og viser dem på skjermen) -->
  <script>
    window.onerror = function(msg, url, lineNo) {
      const boks = document.getElementById('loadingInnhold');
      const overlay = document.getElementById('loadingOverlay');
      if (boks && overlay) {
        boks.innerHTML = '<span class="text-6xl block mb-4">🛑</span><h2 class="text-2xl font-black text-rose-500">Systemkrasj!</h2><p class="text-slate-300 mt-4 text-sm font-mono bg-slate-950 p-3 rounded border border-rose-900/50 break-words">' + msg + '</p><p class="text-slate-500 text-xs mt-3 font-bold uppercase tracking-wider">Linje: ' + lineNo + '</p><p class="text-amber-500 text-sm mt-4 font-bold">Kopier denne teksten og send den til meg!</p>';
        boks.classList.add('border-rose-900', 'shadow-[0_0_30px_rgba(225,29,72,0.2)]');
        overlay.classList.remove('hidden');
      }
      return false;
    };
  </script>

  <!-- INNLOGGINGS-MODAL -->
  <div id="loginModal" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur z-[100] flex flex-col items-center justify-center p-4">
    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 max-w-sm w-full shadow-2xl relative overflow-hidden">
      <div class="text-center mb-6">
        <span class="text-4xl">📚</span>
        <h2 class="text-2xl font-black text-amber-500 mt-2">Samlerbasen</h2>
        <p id="modalUndertekst" class="text-slate-400 text-sm mt-1">Logg inn for å se din og venners samling</p>
      </div>

      <form id="skjemaLoggInn" onsubmit="loggInn(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Brukernavn</label>
          <input type="text" id="loginBrukernavn" required placeholder="F.eks. Jørn" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Passord</label>
          <input type="password" id="loginPassord" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-lg mt-2 transition">Logg inn</button>
        
        <div class="text-center mt-4 space-y-2">
          <p class="text-xs"><button type="button" onclick="byttTilGlemtPassord()" class="text-slate-400 hover:text-white underline transition">Glemt passord?</button></p>
          <p class="text-sm text-slate-400 border-t border-slate-800 pt-3">Ny her? <button type="button" onclick="byttTilRegistrering()" class="text-amber-500 font-bold hover:underline">Opprett konto</button></p>
        </div>
      </form>

      <form id="skjemaRegistrer" onsubmit="registrerBruker(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Brukernavn</label>
          <input type="text" id="regBrukernavn" required placeholder="F.eks. Jørn99" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">E-postadresse</label>
          <input type="email" id="regEpost" required placeholder="din@epost.no" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
        </div>
        
        <!-- Passord med bekreftelse og vis/skjul -->
        <div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Velg passord</label>
              <input type="password" id="regPassord" required placeholder="Min. 6 tegn" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Bekreft passord</label>
              <input type="password" id="regPassordBekreft" required placeholder="Gjenta passord" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
            </div>
          </div>
          <label class="flex items-center gap-1.5 cursor-pointer text-xs text-slate-400 mt-2">
              <input type="checkbox" onchange="document.getElementById('regPassord').type = this.checked ? 'text' : 'password'; document.getElementById('regPassordBekreft').type = this.checked ? 'text' : 'password';" class="rounded text-amber-500 w-3.5 h-3.5 bg-slate-900 border-slate-700"> <span>Vis passord</span>
          </label>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Land</label>
            <input type="text" id="regLand" placeholder="Norge" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Språk</label>
            <select id="regSpraak" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none">
              <option value="Norsk">Norsk</option>
              <option value="Svensk">Svensk</option>
              <option value="Dansk">Dansk</option>
              <option value="Engelsk">Engelsk</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Synlighet</label>
          <select id="regSynlighet" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:border-amber-500 focus:outline-none">
            <option value="offentlig">Offentlig profil</option>
            <option value="privat">Privat profil</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-lg mt-2 transition">Registrer meg</button>
        <p class="text-center text-sm text-slate-400 mt-4">Allerede konto? <button type="button" onclick="byttTilLoggInn()" class="text-amber-500 font-bold hover:underline">Logg inn</button></p>
      </form>

      <form id="skjemaGlemtPassord" onsubmit="sendGlemtPassord(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Skriv inn din E-post</label>
          <input type="email" id="glemtEpostFelt" required placeholder="din@epost.no" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-black py-3 rounded-lg mt-2 transition">Send passord</button>
        <p class="text-center text-sm text-slate-400 mt-4"><button type="button" onclick="byttTilLoggInn()" class="text-slate-300 hover:text-white underline">Tilbake til innlogging</button></p>
      </form>
    </div>
  </div>

  <!-- PROFIL-MODAL -->
  <div id="profilModal" class="hidden fixed inset-0 bg-black/80 z-[60] flex flex-col items-center justify-center p-4">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 max-w-md w-full shadow-2xl overflow-y-auto max-h-[90vh]">
      <h2 class="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2">⚙ Min Profil</h2>
      
      <form onsubmit="lagreProfil(event)" class="space-y-4 text-sm">
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 space-y-3">
          <h3 class="font-bold text-slate-300 text-xs uppercase tracking-wider">Kontodetaljer</h3>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Brukernavn</label>
            <input type="text" id="profilBrukernavn" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">E-postadresse</label>
            <input type="email" id="profilEpost" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Nytt passord (La stå tomt for å beholde)</label>
            <input type="password" id="profilPassord" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" />
          </div>
        </div>
        
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Litt om meg / min samling</label>
          <textarea id="profilInfo" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none"></textarea>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 space-y-2 mt-3">
          <h3 class="font-bold text-slate-300 text-xs uppercase tracking-wider">Hva samler du på?</h3>
          <div class="flex flex-wrap gap-4 text-slate-300">
            <label class="flex items-center gap-
